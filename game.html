<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.C.H.O.-7 // Cyber Dash (Geometry Protocol)</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-dim: #008f39;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff0055;
            --neon-glow: rgba(0, 255, 102, 0.5);
            --bg-dark: #050b07;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-green);
            font-family: 'Courier New', 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* CRT Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
            z-index: 20;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .game-wrapper {
            position: relative;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 35px var(--neon-glow);
            border-radius: 8px;
            overflow: hidden;
            background: #030a05;
        }

        .header-bar {
            background: rgba(0, 25, 12, 0.95);
            border-bottom: 1px solid var(--neon-green);
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }

        /* Progress Bar */
        .progress-container {
            width: 220px;
            height: 12px;
            background: rgba(0, 30, 15, 0.8);
            border: 1px solid var(--neon-green);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            box-shadow: 0 0 10px var(--neon-green);
            transition: width 0.05s linear;
        }

        canvas {
            display: block;
            background: #030c06;
        }

        .controls-hint {
            margin-top: 14px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-align: center;
            color: #8be3ab;
            text-shadow: 0 0 8px var(--neon-glow);
        }

        .key-badge {
            display: inline-block;
            border: 1px solid var(--neon-green);
            padding: 3px 10px;
            border-radius: 4px;
            color: #ffffff;
            background: rgba(0, 255, 102, 0.15);
            box-shadow: 0 0 10px var(--neon-glow);
            font-weight: bold;
        }

        /* Overlay screens */
        .overlay-screen {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(3, 14, 7, 0.88);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 10;
        }

        .overlay-screen h1 {
            font-size: 2.2rem;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--neon-green);
            margin-bottom: 12px;
        }

        .overlay-screen p {
            font-size: 0.95rem;
            color: #a3ffc7;
            margin-bottom: 22px;
            line-height: 1.6;
            max-width: 480px;
        }

        .btn-play {
            background: rgba(0, 40, 18, 0.85);
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 12px 32px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--neon-glow);
            transition: all 0.2s;
        }

        .btn-play:hover {
            background: var(--neon-green);
            color: var(--bg-dark);
            box-shadow: 0 0 35px var(--neon-green);
            transform: scale(1.04);
        }

        .stats-row {
            display: flex;
            gap: 25px;
            margin: 15px 0 20px 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- Top Bar with Attempt & Progress Bar -->
        <div class="header-bar">
            <span id="attemptLabel">ATTEMPT 1</span>
            
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="progress-container">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <span id="progressText" style="min-width: 45px; font-weight: bold;">0%</span>
            </div>

            <span id="soundToggle" onclick="toggleMute()" style="cursor: pointer;" title="Toggle Synth Music">🔊 SYNTH: ON</span>
        </div>

        <canvas id="gameCanvas" width="700" height="400"></canvas>

        <!-- Start Overlay Screen -->
        <div class="overlay-screen" id="startScreen">
            <h1>CYBER DASH</h1>
            <p>
                GEOMETRY PROTOCOL ENGAGED.<br>
                JUMP OVER SPIKES, LAND ON BLOCKS &amp; SURVIVE TO 100%!
            </p>
            <div class="stats-row">
                <div>BEST: <strong id="bestProgress" style="color: var(--neon-cyan);">0%</strong></div>
            </div>
            <button class="btn-play" onclick="startGame()">&gt; START RUN [SPACE] &lt;</button>
        </div>

        <!-- Victory Screen -->
        <div class="overlay-screen" id="winScreen" style="display: none;">
            <h1 style="color: #00f0ff; text-shadow: 0 0 25px #00f0ff;">LEVEL COMPLETE!</h1>
            <p style="font-size: 1.2rem; color: #fff;">100% SYNCHRONIZATION ACHIEVED!</p>
            <button class="btn-play" onclick="restartGame()">&gt; PLAY AGAIN &lt;</button>
        </div>
    </div>

    <div class="controls-hint">
        HOLD OR PRESS <span class="key-badge">SPACE</span> / <span class="key-badge">CLICK</span> TO JUMP &bull; TIMING IS EVERYTHING
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const attemptLabel = document.getElementById('attemptLabel');
        const startScreen = document.getElementById('startScreen');
        const winScreen = document.getElementById('winScreen');
        const bestProgressEl = document.getElementById('bestProgress');
        const soundToggle = document.getElementById('soundToggle');

        // Audio System: Procedural Geometry Dash Techno Synth
        let audioCtx = null;
        let isMuted = false;
        let beatInterval = null;
        let beatStep = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            soundToggle.textContent = isMuted ? '🔇 SYNTH: OFF' : '🔊 SYNTH: ON';
        }

        // Procedural Synth Music Engine (135 BPM Cyber Beat)
        function startMusic() {
            if (beatInterval) clearInterval(beatInterval);
            beatStep = 0;
            // 135 BPM = 16th notes every ~111ms
            beatInterval = setInterval(playSynthStep, 111);
        }

        function stopMusic() {
            if (beatInterval) {
                clearInterval(beatInterval);
                beatInterval = null;
            }
        }

        const bassNotes = [110, 110, 130.81, 110, 146.83, 110, 130.81, 98.00];

        function playSynthStep() {
            if (isMuted || !audioCtx || gameState !== 'PLAYING') return;

            const now = audioCtx.currentTime;
            const step = beatStep % 16;
            beatStep++;

            // Kick drum on beats 0, 4, 8, 12
            if (step % 4 === 0) {
                const kickOsc = audioCtx.createOscillator();
                const kickGain = audioCtx.createGain();
                kickOsc.connect(kickGain);
                kickGain.connect(audioCtx.destination);

                kickOsc.frequency.setValueAtTime(140, now);
                kickOsc.frequency.exponentialRampToValueAtTime(32, now + 0.08);

                kickGain.gain.setValueAtTime(0.35, now);
                kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                kickOsc.start(now);
                kickOsc.stop(now + 0.1);
            }

            // Snare / clap on beats 4, 12
            if (step === 4 || step === 12) {
                const snareOsc = audioCtx.createOscillator();
                const snareGain = audioCtx.createGain();
                snareOsc.type = 'triangle';
                snareOsc.frequency.setValueAtTime(220, now);
                snareOsc.connect(snareGain);
                snareGain.connect(audioCtx.destination);

                snareGain.gain.setValueAtTime(0.18, now);
                snareGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                snareOsc.start(now);
                snareOsc.stop(now + 0.13);
            }

            // Cyber Bass synth pulse on every 16th note
            const bassOsc = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bassOsc.type = 'sawtooth';
            const freq = bassNotes[step % bassNotes.length];
            bassOsc.frequency.setValueAtTime(freq, now);

            bassOsc.connect(bassGain);
            bassGain.connect(audioCtx.destination);

            bassGain.gain.setValueAtTime(0.09, now);
            bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

            bassOsc.start(now);
            bassOsc.stop(now + 0.1);
        }

        function playJumpSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'square';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(680, now + 0.1);

            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

            osc.start(now);
            osc.stop(now + 0.11);
        }

        function playCrashSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.start(now);
            osc.stop(now + 0.26);
        }

        // ==========================================
        // GAME PHYSICS & CONSTANTS
        // ==========================================
        const FLOOR_Y = 320;
        const GRAVITY = 0.88;
        const JUMP_VELOCITY = -13.6;
        const RUN_SPEED = 6.2;
        const PLAYER_SIZE = 34;

        let gameState = 'START'; // START, PLAYING, WIN
        let attempt = 1;
        let highProgress = parseInt(localStorage.getItem('cyberdash_best') || '0');
        bestProgressEl.textContent = `${highProgress}%`;

        let spaceDown = false;
        let distanceTravelled = 0;
        let totalLevelLength = 4800; // Complete level distance

        // Player Robot Cube
        const player = {
            x: 100,
            y: FLOOR_Y - PLAYER_SIZE,
            vy: 0,
            rotation: 0,
            isGrounded: true,
            trail: [],

            reset() {
                this.x = 100;
                this.y = FLOOR_Y - PLAYER_SIZE;
                this.vy = 0;
                this.rotation = 0;
                this.isGrounded = true;
                this.trail = [];
            },

            jump() {
                if (this.isGrounded) {
                    this.vy = JUMP_VELOCITY;
                    this.isGrounded = false;
                    playJumpSound();
                    createJumpRing(this.x + PLAYER_SIZE / 2, this.y + PLAYER_SIZE);
                }
            },

            update() {
                // Apply Gravity
                this.vy += GRAVITY;
                this.y += this.vy;

                // Rotation while in the air (Geometry Dash signature spin)
                if (!this.isGrounded) {
                    this.rotation += 0.14;
                } else {
                    // Snap rotation to nearest 90 degrees when on ground
                    const snapAngle = Math.round(this.rotation / (Math.PI / 2)) * (Math.PI / 2);
                    this.rotation = snapAngle;
                }

                // Check Floor Collision
                if (this.y >= FLOOR_Y - PLAYER_SIZE) {
                    this.y = FLOOR_Y - PLAYER_SIZE;
                    this.vy = 0;
                    this.isGrounded = true;
                }

                // Jump buffering when holding Space
                if (spaceDown && this.isGrounded) {
                    this.jump();
                }

                // Trail Particles
                if (Math.random() > 0.3) {
                    this.trail.push({
                        x: this.x + 4,
                        y: this.y + PLAYER_SIZE - 4,
                        size: Math.random() * 5 + 3,
                        alpha: 0.8
                    });
                }

                // Update trail
                for (let i = this.trail.length - 1; i >= 0; i--) {
                    const t = this.trail[i];
                    t.x -= RUN_SPEED;
                    t.alpha -= 0.05;
                    if (t.alpha <= 0) this.trail.splice(i, 1);
                }
            },

            draw() {
                // Draw trailing ghost particles
                for (const t of this.trail) {
                    ctx.save();
                    ctx.fillStyle = `rgba(0, 255, 102, ${t.alpha})`;
                    ctx.shadowColor = '#00ff66';
                    ctx.shadowBlur = 8;
                    ctx.fillRect(t.x, t.y, t.size, t.size);
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(this.x + PLAYER_SIZE / 2, this.y + PLAYER_SIZE / 2);
                ctx.rotate(this.rotation);

                // Outer Glowing Cube Frame
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 14;
                ctx.fillStyle = '#061c10';
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.roundRect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE, 5);
                ctx.fill();
                ctx.stroke();

                // Inner Geometric Cyber Core
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-PLAYER_SIZE / 4, -PLAYER_SIZE / 4, PLAYER_SIZE / 2, PLAYER_SIZE / 2);

                // Cute Robot Eye in center
                ctx.fillStyle = '#00ff66';
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        };

        // ==========================================
        // LEVEL DESIGN: SPIKES & BLOCKS
        // ==========================================
        // Template level segments (x-offsets, types)
        // type: 'spike', 'block', 'jump_pad'
        const levelData = [
            // Section 1: Intro (0 - 15%)
            { type: 'spike', x: 500 },
            { type: 'spike', x: 850 },
            { type: 'spike', x: 1200 },
            { type: 'block', x: 1400, y: FLOOR_Y - 35, w: 70, h: 35 },
            { type: 'spike', x: 1650 },
            
            // Section 2: Double Spikes & Raised Blocks (15 - 40%)
            { type: 'block', x: 1900, y: FLOOR_Y - 35, w: 100, h: 35 },
            { type: 'spike', x: 2150 },
            { type: 'spike', x: 2200 },
            { type: 'block', x: 2400, y: FLOOR_Y - 35, w: 80, h: 35 },
            { type: 'block', x: 2480, y: FLOOR_Y - 70, w: 80, h: 70 },
            { type: 'spike', x: 2650 },

            // Section 3: Tiered Stairs & Precision Jumps (40 - 70%)
            { type: 'block', x: 2850, y: FLOOR_Y - 35, w: 90, h: 35 },
            { type: 'spike', x: 3000 },
            { type: 'block', x: 3100, y: FLOOR_Y - 50, w: 110, h: 50 },
            { type: 'spike', x: 3260 },
            { type: 'spike', x: 3310 },
            { type: 'block', x: 3450, y: FLOOR_Y - 35, w: 70, h: 35 },
            { type: 'spike', x: 3600 },

            // Section 4: Cyber Overdrive Finale (70 - 100%)
            { type: 'spike', x: 3800 },
            { type: 'block', x: 3950, y: FLOOR_Y - 40, w: 120, h: 40 },
            { type: 'spike', x: 4150 },
            { type: 'spike', x: 4200 },
            { type: 'block', x: 4350, y: FLOOR_Y - 55, w: 140, h: 55 },
            { type: 'spike', x: 4580 }
        ];

        let activeObstacles = [];

        function buildLevel() {
            activeObstacles = levelData.map(item => {
                if (item.type === 'spike') {
                    return {
                        type: 'spike',
                        x: item.x,
                        y: FLOOR_Y,
                        w: 32,
                        h: 34
                    };
                } else if (item.type === 'block') {
                    return {
                        type: 'block',
                        x: item.x,
                        y: item.y,
                        w: item.w,
                        h: item.h
                    };
                }
            });
        }

        // Particle System: Crash Sparks & Jump Rings
        let particles = [];

        function createCrashExplosion(x, y) {
            for (let i = 0; i < 45; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 8;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: Math.random() > 0.4 ? '#00ff66' : '#00f0ff',
                    life: 1.0,
                    decay: 0.03 + Math.random() * 0.03
                });
            }
        }

        function createJumpRing(x, y) {
            particles.push({
                x: x,
                y: y,
                isRing: true,
                radius: 4,
                alpha: 0.9,
                decay: 0.08
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.isRing) {
                    p.radius += 2.5;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) particles.splice(i, 1);
                } else {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.save();
                if (p.isRing) {
                    ctx.strokeStyle = `rgba(0, 255, 102, ${p.alpha})`;
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#00ff66';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
                ctx.restore();
            }
        }

        // ==========================================
        // COLLISION DETECTION
        // ==========================================
        function checkCollisions() {
            let standingOnTop = false;

            for (const obs of activeObstacles) {
                const screenX = obs.x - distanceTravelled;

                // Only check obstacles in active view range
                if (screenX < -100 || screenX > canvas.width + 100) continue;

                if (obs.type === 'spike') {
                    // Triangle spike hitbox (slightly forgiving inner box)
                    const spikeLeft = screenX + 6;
                    const spikeRight = screenX + obs.w - 6;
                    const spikeTop = obs.y - obs.h + 8;
                    const spikeBottom = obs.y;

                    const playerLeft = player.x + 4;
                    const playerRight = player.x + PLAYER_SIZE - 4;
                    const playerTop = player.y + 4;
                    const playerBottom = player.y + PLAYER_SIZE;

                    if (playerRight > spikeLeft && playerLeft < spikeRight &&
                        playerBottom > spikeTop && playerTop < spikeBottom) {
                        triggerCrash();
                        return;
                    }
                } 
                else if (obs.type === 'block') {
                    const blockLeft = screenX;
                    const blockRight = screenX + obs.w;
                    const blockTop = obs.y;
                    const blockBottom = obs.y + obs.h;

                    const pLeft = player.x + 2;
                    const pRight = player.x + PLAYER_SIZE - 2;
                    const pBottom = player.y + PLAYER_SIZE;
                    const pTop = player.y;

                    // Overlap check
                    if (pRight > blockLeft && pLeft < blockRight) {
                        // Check if landing cleanly on top of block
                        if (player.vy >= 0 && pBottom >= blockTop && pBottom <= blockTop + 14 && pTop < blockTop) {
                            player.y = blockTop - PLAYER_SIZE;
                            player.vy = 0;
                            player.isGrounded = true;
                            standingOnTop = true;
                        } 
                        // Otherwise it hit the front wall or bottom of block -> CRASH!
                        else if (pBottom > blockTop + 10 && pTop < blockBottom - 4) {
                            triggerCrash();
                            return;
                        }
                    }
                }
            }

            // If player walks off a block into thin air
            if (!standingOnTop && player.y < FLOOR_Y - PLAYER_SIZE) {
                player.isGrounded = false;
            }
        }

        function triggerCrash() {
            createCrashExplosion(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2);
            playCrashSound();

            attempt++;
            attemptLabel.textContent = `ATTEMPT ${attempt}`;

            // Quick instant respawn for authentic Geometry Dash flow!
            distanceTravelled = 0;
            player.reset();
        }

        // ==========================================
        // DRAWING ENVIRONMENT (PULSING CYBER GRID)
        // ==========================================
        let bgOffset = 0;
        function drawEnvironment() {
            bgOffset = (bgOffset + RUN_SPEED * 0.4) % 50;

            // Background Grid Lines
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.08)';
            ctx.lineWidth = 1;
            for (let x = -bgOffset; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Floor Deck with Neon Top Edge
            ctx.fillStyle = '#021008';
            ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);

            ctx.strokeStyle = '#00ff66';
            ctx.shadowColor = '#00ff66';
            ctx.shadowBlur = 12;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, FLOOR_Y);
            ctx.lineTo(canvas.width, FLOOR_Y);
            ctx.stroke();

            // Floor decorative hazard stripes
            const stripeOffset = (distanceTravelled * 1.0) % 40;
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.18)';
            ctx.lineWidth = 2;
            for (let x = -stripeOffset; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, FLOOR_Y);
                ctx.lineTo(x + 25, canvas.height);
                ctx.stroke();
            }
        }

        function drawObstacles() {
            for (const obs of activeObstacles) {
                const screenX = obs.x - distanceTravelled;
                if (screenX < -150 || screenX > canvas.width + 150) continue;

                if (obs.type === 'spike') {
                    // Geometry Dash Neon Triangle Spike
                    ctx.save();
                    ctx.fillStyle = '#061a0f';
                    ctx.strokeStyle = '#00ff66';
                    ctx.shadowColor = '#00ff66';
                    ctx.shadowBlur = 12;
                    ctx.lineWidth = 2.5;

                    ctx.beginPath();
                    ctx.moveTo(screenX, obs.y);
                    ctx.lineTo(screenX + obs.w / 2, obs.y - obs.h);
                    ctx.lineTo(screenX + obs.w, obs.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Inner glowing spike pattern
                    ctx.strokeStyle = '#00f0ff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(screenX + 8, obs.y);
                    ctx.lineTo(screenX + obs.w / 2, obs.y - obs.h + 10);
                    ctx.lineTo(screenX + obs.w - 8, obs.y);
                    ctx.stroke();

                    ctx.restore();
                } 
                else if (obs.type === 'block') {
                    // Neon Geometric Block
                    ctx.save();
                    ctx.fillStyle = '#061a0f';
                    ctx.strokeStyle = '#00ff66';
                    ctx.shadowColor = '#00ff66';
                    ctx.shadowBlur = 10;
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.roundRect(screenX, obs.y, obs.w, obs.h, 3);
                    ctx.fill();
                    ctx.stroke();

                    // Inner cyber cross design
                    ctx.strokeStyle = 'rgba(0, 255, 102, 0.35)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(screenX + 4, obs.y + 4, obs.w - 8, obs.h - 8);

                    ctx.restore();
                }
            }
        }

        // ==========================================
        // GAME FLOW
        // ==========================================
        function startGame() {
            initAudio();
            startMusic();
            gameState = 'PLAYING';
            distanceTravelled = 0;
            attempt = 1;
            attemptLabel.textContent = `ATTEMPT ${attempt}`;
            player.reset();
            buildLevel();
            startScreen.style.display = 'none';
            winScreen.style.display = 'none';
        }

        function restartGame() {
            startGame();
        }

        function triggerWin() {
            gameState = 'WIN';
            stopMusic();
            highProgress = 100;
            localStorage.setItem('cyberdash_best', '100');
            progressBar.style.width = '100%';
            progressText.textContent = '100%';
            winScreen.style.display = 'flex';
        }

        // Controls: Space & Mouse Click
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                spaceDown = true;
                initAudio();
                if (gameState === 'START') {
                    startGame();
                } else if (gameState === 'PLAYING') {
                    player.jump();
                } else if (gameState === 'WIN') {
                    restartGame();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                spaceDown = false;
            }
        });

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            spaceDown = true;
            initAudio();
            if (gameState === 'START') {
                startGame();
            } else if (gameState === 'PLAYING') {
                player.jump();
            } else if (gameState === 'WIN') {
                restartGame();
            }
        });

        window.addEventListener('pointerup', () => {
            spaceDown = false;
        });

        // ==========================================
        // MAIN GAME LOOP
        // ==========================================
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment();

            if (gameState === 'PLAYING') {
                distanceTravelled += RUN_SPEED;

                // Calculate Progress %
                const currentPct = Math.min(100, Math.floor((distanceTravelled / totalLevelLength) * 100));
                progressBar.style.width = `${currentPct}%`;
                progressText.textContent = `${currentPct}%`;

                if (currentPct > highProgress) {
                    highProgress = currentPct;
                    localStorage.setItem('cyberdash_best', highProgress);
                    bestProgressEl.textContent = `${highProgress}%`;
                }

                // Check Win
                if (distanceTravelled >= totalLevelLength) {
                    triggerWin();
                }

                player.update();
                checkCollisions();
            }

            drawObstacles();
            player.draw();
            updateParticles();
            drawParticles();

            requestAnimationFrame(loop);
        }

        buildLevel();
        loop();
    </script>
</body>
</html>
